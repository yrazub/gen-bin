name: Catalog site

# No `paths:` filter on purpose, as in validate.yml: the site reads the plugin files, so any
# change can change the catalog.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      # Full history: release dates come from `git log` on CHANGELOG.md.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Unit tests
        run: npm test

      # The site is built from the marketplace files alone, so it must build with no network
      # (AC-46). Run it in an empty network namespace; if the runner refuses that, build
      # normally and verify AC-46 by hand.
      - name: Build
        run: |
          if sudo unshare --net -- true 2>/dev/null; then
            sudo unshare --net -- sudo -u "$USER" env "PATH=$PATH" npm run build
          else
            echo "::warning::unshare is not allowed on this runner, so the build ran with the network on. Verify AC-46 by hand."
            npm run build
          fi

      - name: Build tests
        run: npm run test:build

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload the site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  # Pull requests stop after the build job: nothing is deployed from them (AC-28).
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
